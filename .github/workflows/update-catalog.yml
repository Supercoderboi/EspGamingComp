
name: Update Games Catalog

on:
  push:
    branches:
      - main
    paths:
      - "games/**"
      - "tools/generate_catalog.py"
      - ".github/workflows/update-catalog.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate catalog
        run: python tools/generate_catalog.py

      - name: Commit catalog if changed
        run: |
          if git diff --quiet -- games.json; then
            echo "Catalog is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add games.json
          git commit -m "Automatically update games catalog"
          git push
