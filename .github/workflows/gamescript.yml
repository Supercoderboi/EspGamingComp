name: Build and publish GameScript library

on:
  push:
    paths:
      - "games/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/gamescript.yml"
  pull_request:
    paths:
      - "games/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/gamescript.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Test GSC1 packer
        run: python -m unittest discover -s tests -v
      - name: Build Pages site and catalog
        run: python tools/build_game_site.py games build/site
      - name: Save generated games and catalog to the repository
        run: |
          find games -type f -name '*.gsc' -delete
          cp -a build/site/games/. games/
          cp build/site/games.json games.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- games games.json
          if git diff --cached --quiet; then
            echo "Generated games and catalog are already current."
          else
            git commit -m "Build packed GameScript games"
            git push
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
