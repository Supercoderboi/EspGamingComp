name: Pack GameScript games

on:
  push:
    paths:
      - "games/**/*.gs"
      - "tools/gsc_pack.py"
      - ".github/workflows/compile-games.yml"
  workflow_dispatch:

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Pack source files for GameOS
        run: python tools/gsc_pack.py games build/games
      - uses: actions/upload-artifact@v4
        with:
          name: games-gsc1
          path: build/games/
